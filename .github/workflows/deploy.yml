name: Backend CI/CD (Robust)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean package

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # 任何命令失败都退出
            set -x  # 打印执行的命令
            
            echo "=== 开始部署 $(date) ==="
            
            # 进入目标项目文件夹
            cd /home/ubuntu/PezMax/pezmax-backend || { echo "项目目录不存在"; exit 1; }
            
            echo "=== 1. 清理 Docker 资源 ==="
            # 停止并删除旧容器
            sudo docker compose stop server || true
            sudo docker compose rm -f server || true
            
            # 清理悬空镜像，确保完全重新构建
            sudo docker image prune -f || true
            
            echo "=== 2. 更新代码（带重试） ==="
            
            # 函数：带重试的 Git 操作
            git_with_retry() {
              local max_attempts=5
              local attempt=1
              local wait_time=10
              
              while [ $attempt -le $max_attempts ]; do
                echo "Git 操作尝试 $attempt/$max_attempts..."
                
                if "$@"; then
                  echo "✅ Git 操作成功"
                  return 0
                fi
                
                if [ $attempt -lt $max_attempts ]; then
                  echo "⚠️ Git 操作失败，等待 $wait_time 秒后重试..."
                  sleep $wait_time
                  wait_time=$((wait_time * 2))  # 指数退避
                fi
                
                attempt=$((attempt + 1))
              done
              
              echo "❌ Git 操作在 $max_attempts 次尝试后仍然失败"
              return 1
            }
            
            # 确保本地切换到 main 分支
            git checkout -B main
            
            # 配置 Git 使用更宽松的 SSL 设置（解决 TLS 问题）
            git config --global http.sslVerify false || true
            git config --global http.postBuffer 524288000 || true
            git config --global http.lowSpeedLimit 0 || true
            git config --global http.lowSpeedTime 999999 || true
            
            # 方式1: 使用 GitHub Token（主要方式）
            echo "尝试方式1: 使用 GitHub Token 拉取"
            if git_with_retry git fetch https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main; then
              echo "✅ 使用 GitHub Token 成功"
            else
              # 方式2: 尝试 HTTPS（不带身份验证，只读）
              echo "尝试方式2: 使用 HTTPS 拉取"
              if git_with_retry git fetch https://github.com/${{ github.repository }}.git main; then
                echo "✅ 使用 HTTPS 成功"
              else
                # 方式3: 尝试浅克隆（如果都失败，就尽量获取最新的）
                echo "尝试方式3: 浅克隆"
                git_with_retry git fetch --depth 1 https://github.com/${{ github.repository }}.git main || {
                  echo "❌ 所有 Git 拉取方式都失败了，尝试使用现有代码继续部署..."
                  # 即使 Git 失败，也尝试用现有代码部署
                }
              fi
            fi
            
            # 只有 FETCH_HEAD 存在时才重置
            if [ -f .git/FETCH_HEAD ]; then
              # 显示将要拉取的提交（便于调试）
              echo "即将应用的变更："
              git log HEAD..FETCH_HEAD --oneline --stat 2>/dev/null || echo "无法获取变更日志"
              
              # 强制重置
              git reset --hard FETCH_HEAD || true
            fi
            
            # 验证代码版本
            echo "当前代码版本："
            git log -1 --oneline 2>/dev/null || echo "无法获取 Git 版本"
            
            echo "=== 3. 构建并启动服务 ==="
            # 使用 --no-cache 强制完全重新构建
            sudo docker compose build --no-cache server
            
            # 启动服务
            sudo docker compose up -d server
            
            echo "=== 4. 等待服务启动 ==="
            # 等待容器启动
            sleep 20
            
            echo "=== 5. 验证部署 ==="
            # 检查容器是否运行
            if sudo docker compose ps | grep -q "ptmj-server.*Up"; then
              echo "✅ 容器运行正常"
            else
              echo "❌ 容器未正常运行"
              sudo docker compose logs server
              exit 1
            fi
            
            # 检查应用是否响应
            echo "最近的容器日志："
            sudo docker compose logs --tail=50 server
            
            echo "=== ✅ 部署完成 $(date) ==="
